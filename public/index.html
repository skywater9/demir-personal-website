<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="header" class="page-section">
        <h1>Welcome to Demir's Website</h1>
        <p>Hello! I'm Demir and this is my website.</p>
    </section>

    <section id="section2" class="page-section">
        <h1>Click Me!</h1>
        <p>Count: <span id="clickCount">-</span></p>
        <button type="button" id="resetClickCount">Reset Click Count</button>
    </section>

    <section id="section3" class="page-section">
        <h1>START GAME</h1>
        <p>Starts the game</p>
    </section>

    <section id="counter" class="page-section">
        <h1>Counter</h1>
        <p>Count: <span id="count">0</span></p>
</body>

<script defer src="scripts/main.js"></script>

</html>
